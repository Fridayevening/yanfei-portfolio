name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages.
#
# One-time setup (Settings → Pages → Build and deployment → Source = "GitHub Actions").
# After that, every push to main deploys automatically.
#
# Notes:
# - Routing is hash-based, so no SPA fallback / 404 rewrite is needed.
# - vite.config.ts sets base: './', so the subpath URL (user.github.io/repo/) resolves correctly.
# - npm run build runs `tsc -b && vite build`, so this also typechecks.
# - `npm run check:content` is deliberately NOT run here: it compares against a source
#   repository that is not present in CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-progress deployment finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
